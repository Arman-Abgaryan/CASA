spring:
  application:
    name: casa-backend
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: false

anthropic:
  api:
    key: ${ANTHROPIC_API_KEY}

server:
  port: ${PORT:8080}

app:
  security:
    jwt-secret: ${JWT_SECRET:ZmFrZV9sb25nZXJfZGV2X3NlY3JldF90aGFuXzMyYnl0ZXM=}
  cors:
    allowed-origins: http://localhost:5173
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
