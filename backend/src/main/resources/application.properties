# AIVEN CLOUD MYSQL CONNECTION
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=${PORT:8080}

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SESSION / COOKIE (for login)
server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.secure=true

# CONNECTION POOL (Hikari)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# PLAID (sandbox by default; set PLAID_ENV=production once approved)
plaid.client-id=${PLAID_CLIENT_ID}
plaid.secret=${PLAID_SECRET}
plaid.env=${PLAID_ENV:sandbox}

# MAIL (Brevo HTTPS API — works on Render free tier; SMTP is blocked there)
brevo.api-key=${BREVO_API_KEY}

# APP
app.mail.from=${MAIL_FROM}
app.mail.from-name=${MAIL_FROM_NAME:CASA}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# GEMINI (free tier, used by GeminiCsvParserService for CSV imports)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-2.5-flash}
